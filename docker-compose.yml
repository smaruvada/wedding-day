services:
  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: wedding_day
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_day"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    ports: ["3001:3001"]
    environment:
      DATABASE_URL: postgres://wedding:wedding@db:5432/wedding_day
      JWT_SECRET: development-only-secret-change-me
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      CLIENT_ORIGIN: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
volumes:
  postgres_data:
  uploads:
